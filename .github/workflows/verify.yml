name: Verify geometry and prototype pack
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  full-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[cad]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python -m tesseract all --config config/default.toml --output output
      - run: python tests/browser_smoke.py output/viewer.html --screenshot output/viewer.png
      - run: python scripts/package_example.py --output output --destination .cache/verified-example
      - uses: actions/upload-artifact@v4
        with:
          name: tesseract-study-and-cad
          path: output/
