[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-prototype"
version = "0.1.0"
description = "Reproducible geometry studies and prototype parts for a physical tesseract"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "matplotlib>=3.9,<4", "Pillow>=10,<13"]

[project.optional-dependencies]
cad = ["build123d==0.10.0"]

[project.scripts]
tesseract = "tesseract.cli:main"

[tool.setuptools.packages.find]
include = ["tesseract*"]

[tool.setuptools.package-data]
tesseract = ["viewer.html"]
